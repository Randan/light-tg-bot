services:
  app:
    build: .
    container_name: light-tg-bot
    env_file: .env
    environment:
      # Local time for /stats period boundaries ("today", "this week")
      TZ: Europe/Kyiv
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
